[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polygon-packings"
version = "1.0.0"
description = "Exact extremal theory of packing/covering maximal outerplanar graphs over a fixed Hamiltonian cycle, with verified constructions"
authors = [{name = "rajveersinh-is-dev"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/rajveersinh-is-dev/polygon-triangulation-packing"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
